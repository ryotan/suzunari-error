name: 'Dependency Review'

# Block PRs that introduce dependencies with a moderate-or-higher severity advisory. This repository is public,
# so `actions/dependency-review-action` is available without GitHub Advanced Security and it adds license-policy
# checks on top of the vulnerability scan.
on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    name: 'Dependency Review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # The action posts a summary comment on failure.
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        # Endpoints below were baselined from the audit-mode log observed across recent successful runs.
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.deps.dev:443
            api.github.com:443
            api.securityscorecards.dev:443
            github.com:443
            *.actions.githubusercontent.com:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: on-failure
          fail-on-severity: moderate
