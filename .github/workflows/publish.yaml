name: '🎉 Publish 🚀'

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A cancelled run can leave macro-impl published and suzunari-error not.
  cancel-in-progress: false

# Default-deny token permissions; each job grants what it needs.
permissions:
  contents: read

jobs:
  crates-io:
    name: crates.io
    runs-on: ubuntu-latest
    environment: crates.io
    permissions:
      id-token: write # Needed for crates.io trusted publishing via OIDC.
      contents: read
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            crates.io:443
            index.crates.io:443
            static.crates.io:443
            static.rust-lang.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: step-security/setup-rust-toolchain@f547b7511b1e8f8d1cda8ef9f27bc365e7761fee # v2.0.0
        with:
          cache-workspaces: . -> target

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Dry run — suzunari-error-macro-impl
        run: cargo publish --dry-run -p suzunari-error-macro-impl

      - name: Publish suzunari-error-macro-impl
        run: cargo publish -p suzunari-error-macro-impl
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Wait for macro-impl to be indexed on crates.io
        run: sleep 30

      - name: Dry run — suzunari-error
        run: cargo publish --dry-run -p suzunari-error

      - name: Publish suzunari-error
        run: cargo publish -p suzunari-error
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    name: GitHub Release
    # A separate job, not a step in crates-io: a failed release can then be re-run without repeating
    # `cargo publish`, which fails once the version is on crates.io. It also keeps `contents: write`
    # out of the job holding the crates.io OIDC token.
    needs: crates-io
    # workflow_dispatch can run this from a branch, where there is no tag to release.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Releases live under `contents` and there is no narrower scope.
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        # gh reaches only api.github.com, which Harden-Runner allows by default.
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job does not check out, so gh has no git remote to resolve the repository from.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # `gh release create` cannot put text above the generated notes, so they are fetched here
          # and the crates.io link prepended.
          notes="$(gh api --method POST "repos/${GH_REPO}/releases/generate-notes" \
            -f "tag_name=${TAG}" --jq '.body')"
          {
            printf 'Available on crates.io: [`suzunari-error` %s](https://crates.io/crates/suzunari-error/%s)\n\n' \
              "$version" "$version"
            printf '%s\n' "$notes"
          } > release-notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release-notes.md
