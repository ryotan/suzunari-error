name: 'Code Quality'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pushes to a PR branch are cancelled; runs on main are left to finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default-deny token permissions; the lint job below does not need anything more than read access to clone the
# repository.
permissions:
  contents: read

jobs:
  lint:
    name: 'Lint'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The slowest matrix leg observed is under 5 minutes; 30 absorbs a cold cache.
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        # Block unexpected egress and process activity on the runner. The allowed-endpoints list below was
        # baselined from the audit-mode log of Linux runs, so block mode is Linux-only for now; macOS and
        # Windows stay in audit until their own egress has been baselined the same way.
        #
        # A step-level `if:` cannot gate this action — its `pre` step has no `pre-if`, so it defaults to
        # always() and applies the policy even when the step itself is skipped. Since v2.20.0 that policy
        # is actually enforced on macOS and Windows, so the egress policy itself has to carry the condition.
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ runner.os == 'Linux' && 'block' || 'audit' }}
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            index.crates.io:443
            mise.jdx.dev:443
            static.crates.io:443
            static.rust-lang.org:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: step-security/setup-rust-toolchain@f547b7511b1e8f8d1cda8ef9f27bc365e7761fee # v2.0.0
        with:
          cache-workspaces: . -> target

      - name: Install additional problem matchers
        run: echo "::add-matcher::.github/problem-matchers.json"

      - name: Install cargo-hack
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          # mise ignores `paranoid` outside the global config, so CI asks for it with this variable.
          # See .config/mise/config.toml.
          MISE_PARANOID: 'true'
        with:
          version: '2026.9.7'
          install_args: 'github:taiki-e/cargo-hack'

      - name: Check formatting
        id: fmt
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Clippy (every feature combination)
        id: clippy
        run: cargo hack --workspace --feature-powerset clippy --all-targets -- -D warnings
        continue-on-error: true

      - name: Test (every feature combination)
        id: test
        run: cargo hack --workspace --feature-powerset test
        continue-on-error: true

      - name: Report results
        if: always()
        shell: bash
        env:
          RESULTS: |
            fmt=${{ steps.fmt.outcome }}
            clippy=${{ steps.clippy.outcome }}
            test=${{ steps.test.outcome }}
        run: |
          failed=0
          while IFS='=' read -r name outcome; do
            [ -z "$name" ] && continue
            if [ "$outcome" = "failure" ]; then
              echo "::error::$name failed"
              failed=1
            fi
          done <<< "$RESULTS"
          if [ "$failed" -eq 1 ]; then
            exit 1
          fi
          echo "All steps succeeded."
