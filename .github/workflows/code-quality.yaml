name: 'Code Quality'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pushes to a PR branch are cancelled; runs on main are left to finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default-deny token permissions; the lint job below does not need anything more than read access to clone the
# repository.
permissions:
  contents: read

jobs:
  lint:
    name: 'Lint'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The slowest matrix leg observed is under 5 minutes; 30 absorbs a cold cache.
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        # Block unexpected egress and process activity on the runner.
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            *.c.lencr.org:80
            c.pki.goog:80
            crl.globalsign.com:80
            crl.sectigo.com:80
            index.crates.io:443
            mise.jdx.dev:443
            ocsp.globalsign.com:80
            ocsp.sectigo.com:80
            ocsp2.globalsign.com:80
            pkg-containers.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: step-security/setup-rust-toolchain@f547b7511b1e8f8d1cda8ef9f27bc365e7761fee # v2.0.0
        with:
          cache-workspaces: . -> target

      - name: Install additional problem matchers
        run: echo "::add-matcher::.github/problem-matchers.json"

      - name: Install cargo-hack
        uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        env:
          # mise ignores `paranoid` outside the global config, so CI asks for it with this variable.
          # See .config/mise/config.toml.
          MISE_PARANOID: 'true'
        with:
          version: '2026.10.2'
          install_args: 'github:taiki-e/cargo-hack'
          cache_key_prefix: mise-v2

      - name: Check formatting
        id: fmt
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Clippy (every feature combination)
        id: clippy
        run: cargo hack --workspace --feature-powerset clippy --all-targets -- -D warnings
        continue-on-error: true

      - name: Test (every feature combination)
        id: test
        run: cargo hack --workspace --feature-powerset test
        continue-on-error: true

      - name: Report results
        if: always()
        shell: bash
        env:
          RESULTS: |
            fmt=${{ steps.fmt.outcome }}
            clippy=${{ steps.clippy.outcome }}
            test=${{ steps.test.outcome }}
        run: |
          failed=0
          while IFS='=' read -r name outcome; do
            [ -z "$name" ] && continue
            if [ "$outcome" = "failure" ]; then
              echo "::error::$name failed"
              failed=1
            fi
          done <<< "$RESULTS"
          if [ "$failed" -eq 1 ]; then
            exit 1
          fi
          echo "All steps succeeded."
