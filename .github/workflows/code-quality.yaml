name: 'Code Quality'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pushes to a PR branch are cancelled; runs on main are left to finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default-deny token permissions; the lint job below does not need anything more than read access to clone the
# repository.
permissions:
  contents: read

jobs:
  lint:
    name: 'Lint'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The slowest matrix leg observed is under 5 minutes; 30 absorbs a cold cache.
    timeout-minutes: 30
    env:
      # Selects tools by file rather than install_args, so the cache key can hash them.
      MISE_ENV: ci-lint
    steps:
      - name: Harden Runner
        # Block unexpected egress and process activity on the runner.
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            *.c.lencr.org:80
            c.pki.goog:80
            crl.globalsign.com:80
            crl.sectigo.com:80
            index.crates.io:443
            mise.jdx.dev:443
            ocsp.globalsign.com:80
            ocsp.sectigo.com:80
            ocsp2.globalsign.com:80
            pkg-containers.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443
            tuf-repo-cdn.sigstore.dev:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: step-security/setup-rust-toolchain@f547b7511b1e8f8d1cda8ef9f27bc365e7761fee # v2.0.0
        with:
          cache-workspaces: . -> target

      # Cache the files mise downloads, not the installed tools:
      # https://mise.jdx.dev/continuous-integration.html#trusted-cache
      - name: Cache mise download store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mise/downloads-cas
          key: >-
            mise-downloads-${{ runner.os }}-${{ runner.arch }}-${{ env.MISE_ENV }}-${{
            hashFiles('.config/mise/config*.toml', '.config/mise/mise*.lock') }}

      - name: Install cargo-hack
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        env:
          # mise ignores `paranoid` outside the global config, so CI asks for it with this variable.
          # See .config/mise/config.toml.
          MISE_PARANOID: 'true'
          # One path on every OS: actions/cache cannot expand %TEMP%, mise's default on Windows.
          MISE_CACHE_DIR: ${{ runner.temp }}/mise
        with:
          version: '2026.10.11'
          cache: false

      - name: Check formatting
        id: fmt
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Clippy (every feature combination)
        id: clippy
        run: cargo hack --workspace --feature-powerset clippy --all-targets -- -D warnings
        continue-on-error: true

      - name: Test (every feature combination)
        id: test
        run: cargo hack --workspace --feature-powerset test
        continue-on-error: true

      - name: Report results
        if: always()
        shell: bash
        env:
          RESULTS: |
            fmt=${{ steps.fmt.outcome }}
            clippy=${{ steps.clippy.outcome }}
            test=${{ steps.test.outcome }}
        run: |
          failed=0
          while IFS='=' read -r name outcome; do
            [ -z "$name" ] && continue
            if [ "$outcome" = "failure" ]; then
              echo "::error::$name failed"
              failed=1
            fi
          done <<< "$RESULTS"
          if [ "$failed" -eq 1 ]; then
            exit 1
          fi
          echo "All steps succeeded."
