name: 'CodeQL'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '30 2 * * 6'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pushes to a PR branch are cancelled; runs on main are left to finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default-deny token permissions; the analysis job grants what it needs.
permissions:
  contents: read

jobs:
  analyze:
    name: 'CodeQL (rust)'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Uploads the analysis to code scanning.
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            index.crates.io:443
            release-assets.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: rust
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:rust
