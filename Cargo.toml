[workspace.package]
description = "A highly traceable and noise-free error system that propagates error locations as error contexts and minimizes information output to the log"
version = "0.3.0"
edition = "2024"
repository = "https://github.com/ryotan/suzunari-error"
license = "MIT OR Apache-2.0"
authors = ["ryotan"]
rust-version = "1.85"

[workspace]
members = ["macro-impl", "tests-features"]

[workspace.dependencies]
snafu = { version = "0.9.0", default-features = false }
proc-macro2 = "1.0"
quote = "1.0"
syn = "3.0"
# Workspace local crates
suzunari-error = { path = ".", default-features = false }
suzunari-error-macro-impl = { version = "0.3.0", path = "./macro-impl", default-features = false }

[package]
name = "suzunari-error"
description.workspace = true
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"

# The crate documentation describes the `serde` feature in full — a row in the
# feature table and a section of its own — but the only public name the feature
# adds is `impl Serialize for BoxedStackError`, which a default-feature build
# leaves out. Without this the published docs promise an impl they do not list.
[package.metadata.docs.rs]
all-features = true

[features]
default = ["std"]
std = ["alloc", "snafu/std"]
alloc = ["snafu/alloc", "suzunari-error-macro-impl/alloc"]
# Does not imply alloc: the BoxedStackError impl is confined to the alloc tier
# only because the type is.
serde = ["dep:serde", "suzunari-error-macro-impl/serde"]

[dependencies]
snafu = { workspace = true, features = ["rust_1_81"] }
suzunari-error-macro-impl.workspace = true
serde = { version = "1.0", default-features = false, optional = true, features = [
  "derive",
] }

[dev-dependencies]
trybuild = "=1.0.121"
serde_json = "1.0"
# Token-level comparison: catches struct names and field counts that a JSON
# string comparison hides. Requires std.
serde_test = "1.0"
# One format per shape of the serde ecosystem, so that a conclusion rests on the
# format's properties rather than on one crate's quirks. Two carry field names
# (ciborium, rmp-serde) and two do not (bincode, postcard); serde_json above is
# the self-describing text case.
bincode = { version = "2", features = ["serde"] }
ciborium = "0.2"
postcard = { version = "1", features = ["use-std"] }
rmp-serde = "1"
# Schema validators, so the definitions in src/payload.md are checked against
# a real payload rather than left to rot.
jsonschema = "0.52"
cddl = "0.10"

# All three use `#[report]`, which needs `std`. Declaring that lets `cargo test
# --no-default-features` skip them instead of failing to build them.
[[example]]
name = "basic"
required-features = ["std"]

[[example]]
name = "boxed_error"
required-features = ["std"]

[[example]]
name = "display_error"
required-features = ["std"]
